name: MIO PRV-11 Cross-Platform Crash Matrix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-node-crash-recovery:
    name: Trusted 3D platform recovery/safety — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact lockfile dependencies
        run: npm ci
      - name: Platform-specific crash recovery or Windows fail-closed guard
        run: node --import tsx scripts/benchmarks/trusted-cube-platform-matrix.ts
