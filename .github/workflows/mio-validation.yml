name: MIO Validation Gate

on:
  pull_request:
    branches:
      - main
      - refactor/mio-web-lab-v2
  push:
    branches:
      - milestone/**
      - refactor/mio-web-lab-v2
      - mio/sfx-10.18-final

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build web application
        run: npm run build

      - name: Build Electron main and preload
        run: npm run build:electron

      - name: Run MIO system and security tests
        run: npm test
