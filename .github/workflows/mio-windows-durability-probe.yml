name: MIO Windows Durability Probe

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-durability-conformance:
    name: Windows native file primitives — diagnosis only
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact lockfile dependencies
        id: dependencies
        run: npm ci
      - name: Probe file flush, exclusive lock, rename, and directory publication
        run: node --import tsx scripts/benchmarks/windows-durability-probe.ts
      - name: Windows append-only journal prototype integrity
        run: node --import tsx scripts/benchmarks/windows-journal-prototype-check.ts
      - name: Held file identity and pathname replacement diagnosis
        run: node scripts/benchmarks/windows-journal-file-id-probe.mjs
      - name: Native Windows file-ID and handle sharing probe (diagnosis only)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/benchmarks/windows-native-identity-probe.ps1
      - name: Native guarded open and reparse denial (diagnosis only)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/benchmarks/windows-native-guarded-open-probe.ps1
      - name: Native handle-bound journal I/O (diagnosis only)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/benchmarks/windows-native-handle-io-probe.ps1
