name: Vendor MediaPipe Pose Model

on:
  push:
    branches: ['audit/security-hardening-2026-09-12']
    paths: ['.gitignore']

permissions:
  contents: write

jobs:
  vendor-model:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/security-hardening-2026-09-12
      - name: Download official MediaPipe Pose Landmarker Lite model
        shell: bash
        run: |
          mkdir -p public/mediapipe/models
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task' \
            --output public/mediapipe/models/pose_landmarker_lite.task
          test -s public/mediapipe/models/pose_landmarker_lite.task
          sha256sum public/mediapipe/models/pose_landmarker_lite.task | tee public/mediapipe/models/pose_landmarker_lite.task.sha256
          test $(stat -c%s public/mediapipe/models/pose_landmarker_lite.task) -lt 25000000
      - name: Commit model and checksum
        shell: bash
        run: |
          if git status --porcelain -- public/mediapipe/models | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/mediapipe/models
            git commit -m "chore(motion): vendor official MediaPipe Pose Landmarker Lite model"
            git push origin HEAD:audit/security-hardening-2026-09-12
          fi
