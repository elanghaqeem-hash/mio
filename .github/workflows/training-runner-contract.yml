name: MIO Training Runner Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-training-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile governed training runners
        run: |
          python -m py_compile training/train_mio_lora.py training/sft_lora.py

      - name: Run standard-library training runner self-test
        run: python training/train_mio_lora.py --self-test

      - name: Validate desktop governed training packaging contract
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const resources = pkg.build?.extraResources ?? [];
          const training = resources.find((item) => item?.from === 'training' && item?.to === 'training');
          if (!training || !Array.isArray(training.filter) || !training.filter.includes('train_mio_lora.py')) {
            throw new Error('Packaged desktop build must carry the fixed governed training runner as an extraResource');
          }
          const manager = fs.readFileSync('electron/ipc/trainingJobManager.ts', 'utf8');
          for (const marker of ["shell: false", "HF_HUB_OFFLINE = '1'", "TRANSFORMERS_OFFLINE = '1'", "HF_DATASETS_OFFLINE = '1'"]) {
            if (!manager.includes(marker)) throw new Error(`Desktop training contract marker missing: ${marker}`);
          }
          if (manager.includes('exec(') || manager.includes('shell: true')) throw new Error('Desktop training manager must not expose shell/exec execution');
          console.log('Desktop governed training packaging and fixed-entrypoint contract: PASS');
          NODE

      - name: Validate training run handoff packager
        run: |
          node --check scripts/training/create-training-run-handoff.mjs
          node scripts/training/create-training-run-handoff.mjs --self-test

      - name: Validate portable candidate evidence verifier
        run: |
          node --check scripts/training/verify-candidate-evidence-package.mjs
          node scripts/training/verify-candidate-evidence-package.mjs --self-test

      - name: Validate signed candidate evidence signer
        run: |
          node --check scripts/training/sign-candidate-evidence-package.mjs
          node scripts/training/sign-candidate-evidence-package.mjs --self-test

      - name: Validate signed candidate evidence verifier
        run: |
          node --check scripts/training/verify-signed-candidate-evidence-package.mjs
          node scripts/training/verify-signed-candidate-evidence-package.mjs --self-test

      - name: Validate signed artifact provenance utility
        run: |
          node --check scripts/training/sign-model-artifact-provenance.mjs
          node scripts/training/sign-model-artifact-provenance.mjs --self-test

      - name: Validate portable signer audit verifier
        run: |
          node --check scripts/training/verify-signer-audit-bundle.mjs
          node scripts/training/verify-signer-audit-bundle.mjs --self-test

      - name: Validate offline signer audit attestation utility
        run: |
          node --check scripts/training/attest-signer-audit-bundle.mjs
          node scripts/training/attest-signer-audit-bundle.mjs --self-test

      - name: Confirm training dependencies stay isolated
        run: |
          python - <<'PY'
          from pathlib import Path
          package = Path('package.json').read_text(encoding='utf-8')
          forbidden = ['torch==', 'transformers==', 'bitsandbytes==', 'peft==', 'trl==']
          if any(item in package for item in forbidden):
              raise SystemExit('ML training dependency leaked into package.json')
          print('Training dependencies remain isolated from the Mio JS runtime.')
          PY
