name: Sync MediaPipe Lockfile

on:
  push:
    branches: ['audit/security-hardening-2026-09-12']
    paths: ['package.json']

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/security-hardening-2026-09-12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize exact MediaPipe dependency
        run: npm install --package-lock-only --save-exact @mediapipe/tasks-vision@1.0.0
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): lock MediaPipe Tasks Vision 1.0.0"
          git push origin HEAD:audit/security-hardening-2026-09-12
