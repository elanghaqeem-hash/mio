name: Mio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build web
        run: npm run build:web

      - name: Build Electron main process
        run: npm run build:electron

      - name: Test and release smoke
        run: npm test

      - name: File scanner benchmark
        run: npm run benchmark:file-scanner

  electron-gui-smoke:
    name: Electron 3D GUI Smoke (Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build Electron main and preload
        run: npm run build:electron
      - name: Run native Electron window / IPC / consent GUI smoke
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
        run: npm run test:electron-gui
