name: MIO Dependency Security Audit
on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/local-ai-dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Production dependency audit (high/critical gate)
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit inventory (non-gating)
        shell: bash
        run: |
          npm audit --json > dependency-audit.json || true
          node -e "const a=require('./dependency-audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities ?? {}, affectedPackages:Object.keys(a.vulnerabilities ?? {})}, null, 2))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mio-dependency-audit
          path: dependency-audit.json
          retention-days: 7
